services:
  fire-glass:
    build: .
    container_name: fire-glass-app
    #ports:
    #  - "8000:8000"
    networks:
      - dokploy-network
    volumes:
      # Keep the tarot source files and legacy SQLite file available for import.
      - ./data:/code/data
    restart: unless-stopped

networks:
  dokploy-network:
    external: true